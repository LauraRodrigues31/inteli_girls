[pytest]
# Define o rootdir do pytest para esta pasta, ignorando o pyproject.toml do ADK em C:\Users\Admin.
# Todos os integrantes devem manter seus testes em conecta-conselho/tests/
# para serem coletados automaticamente por 'python -m pytest'.
# pythonpath configura o sys.path para resolver os dois pacotes 'tools':
#   .              → inteli_girls/tools/tool_<nome>.py  (ferramentas ADK)
#   conecta-conselho → conecta-conselho/tools/consultar_regiao.py (consultas compartilhadas)
testpaths = conecta-conselho/tests
pythonpath = . conecta-conselho
